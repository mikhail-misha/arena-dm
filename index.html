<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Arena DM</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; background: #000; touch-action: none; }
  canvas { display: block; }
  #menu { position: fixed; inset: 0; background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: #fff; padding: 20px; overflow-y: auto; }
  #menu h1 { font-size: 3rem; margin-bottom: 0.5rem; background: linear-gradient(90deg, #ff6b00, #ff006e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-align: center; letter-spacing: 2px; }
  #menu p { margin-bottom: 1.5rem; color: #8b9dc3; text-align: center; font-size: 0.9rem; }
  #menu .box { background: rgba(255,255,255,0.05); padding: 1.5rem; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 0.9rem; width: 100%; max-width: 360px; }
  #menu input { padding: 12px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: #fff; font-size: 1rem; outline: none; }
  #menu input:focus { border-color: #ff006e; }
  #menu button { padding: 14px 24px; border-radius: 8px; border: none; background: linear-gradient(90deg, #ff6b00, #ff006e); color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; letter-spacing: 0.5px; }
  #menu button:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,0,110,0.4); }
  #menu button:disabled { opacity: 0.5; cursor: not-allowed; }
  #menu .alt-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); font-weight: 600; }
  #menu .offline-btn { background: linear-gradient(90deg, #00c853, #00e676); font-size: 1.1rem; }
  #menu .status { font-size: 0.9rem; color: #8b9dc3; min-height: 20px; text-align: center; }
  #menu .code { font-family: monospace; font-size: 1.4rem; color: #00e676; letter-spacing: 2px; text-align: center; padding: 8px; background: rgba(0,230,118,0.1); border-radius: 8px; word-break: break-all; }
  #menu .divider { display: flex; align-items: center; gap: 12px; color: #8b9dc3; font-size: 0.85rem; }
  #menu .divider::before, #menu .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.15); }
  .mode-toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; background: rgba(0,0,0,0.25); border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; user-select: none; }
  .mode-toggle .label { display: flex; align-items: center; gap: 8px; font-size: 0.95rem; }
  .mode-toggle .switch { width: 44px; height: 24px; border-radius: 12px; background: rgba(255,255,255,0.15); position: relative; transition: background 0.25s; flex-shrink: 0; }
  .mode-toggle .switch::after { content: ''; position: absolute; width: 18px; height: 18px; border-radius: 50%; background: #fff; top: 3px; left: 3px; transition: left 0.25s; }
  .mode-toggle.active .switch { background: linear-gradient(90deg, #ff6b00, #ff006e); }
  .mode-toggle.active .switch::after { left: 23px; }
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 10; }
  #room-id { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.6); padding: 8px 14px; border-radius: 8px; color: #00e676; font-size: 0.85rem; font-weight: 700; letter-spacing: 1px; border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(8px); font-family: monospace; pointer-events: auto; user-select: text; z-index: 11; }
  #room-id .label { color: #8b9dc3; font-weight: 400; margin-right: 6px; }
  #room-id .code { color: #00e676; }
  #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 22px; height: 22px; transition: width 0.15s, height 0.15s; }
  #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(0,255,100,0.9); box-shadow: 0 0 4px rgba(0,255,100,0.8); transition: all 0.15s; }
  #crosshair::before { width: 2px; height: 22px; left: 50%; top: 0; transform: translateX(-50%); }
  #crosshair::after { width: 22px; height: 2px; left: 0; top: 50%; transform: translateY(-50%); }
  #crosshair.hit::before, #crosshair.hit::after { background: #ff2222; box-shadow: 0 0 8px #ff2222; }
  #crosshair.ads { width: 10px; height: 10px; }
  #crosshair.ads::before { height: 10px; }
  #crosshair.ads::after { width: 10px; }
  #crosshair.reloading { opacity: 0.4; }
  #healthbar { position: absolute; bottom: 30px; left: 30px; width: 240px; height: 28px; background: rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.3); border-radius: 8px; overflow: hidden; }
  #healthbar .fill { height: 100%; background: linear-gradient(90deg, #00e676, #00c853); transition: width 0.2s, background 0.2s; }
  #healthbar .text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 0.9rem; text-shadow: 1px 1px 2px #000; }
  #ammo { position: absolute; bottom: 30px; right: 30px; color: #fff; font-size: 2rem; font-weight: 700; text-shadow: 0 0 10px rgba(255,107,0,0.8); text-align: right; line-height: 1; }
  #ammo .reserve { font-size: 1rem; color: #8b9dc3; }
  #ammo .reloading { font-size: 0.9rem; color: #ff6b00; }
  #ammo .reloadbar { width: 120px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; margin-top: 6px; margin-left: auto; overflow: hidden; display: none; }
  #ammo .reloadbar .fill { height: 100%; background: #ff6b00; transition: width 0.05s linear; }
  #scoreboard { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.6); padding: 12px 18px; border-radius: 10px; color: #fff; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(8px); min-width: 180px; }
  #scoreboard .title { color: #ff6b00; font-weight: 700; margin-bottom: 8px; font-size: 0.9rem; }
  #scoreboard .row { display: flex; justify-content: space-between; margin-top: 4px; padding: 2px 0; }
  #scoreboard .row.me { color: #00e676; font-weight: 600; }
  #scoreboard .row .kills { color: #ff6b00; font-weight: 700; }
  #killfeed { position: absolute; top: 80px; left: 20px; display: flex; flex-direction: column; gap: 6px; }
  #killfeed .kf { background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 6px; color: #fff; font-size: 0.85rem; border-left: 3px solid #ff006e; animation: kfIn 0.3s ease-out; }
  @keyframes kfIn { from { transform: translateX(-30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  #killfeed .kf .killer { color: #00e676; font-weight: 600; }
  #killfeed .kf .victim { color: #ff5555; font-weight: 600; }
  #respawn-overlay { position: absolute; inset: 0; background: rgba(180,0,0,0.3); display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff; font-size: 2rem; font-weight: 700; text-shadow: 2px 2px 4px #000; }
  #respawn-overlay.active { display: flex; }
  #respawn-overlay .timer { font-size: 4rem; color: #ff6b00; margin-top: 10px; }
  #hitmarker { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #ff0000; font-size: 2rem; font-weight: 700; opacity: 0; transition: opacity 0.1s; pointer-events: none; }
  #hitmarker.show { opacity: 1; }
  #controls-hint { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 8px; color: #8b9dc3; font-size: 0.8rem; display: none; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); pointer-events: none; z-index: 10; text-align: center; line-height: 1.6; }
  #controls-hint b { color: #ff6b00; }
  #state-indicator { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -150px); color: #fff; font-size: 0.75rem; font-weight: 600; background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 6px; opacity: 0; transition: opacity 0.2s; text-transform: uppercase; letter-spacing: 1px; }
  #state-indicator.show { opacity: 1; }
  #state-indicator.crouch { color: #00d4ff; }
  #state-indicator.sprint { color: #ffaa00; }
  #state-indicator.ads { color: #00e676; }
  #mobile-controls { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 20; }
  #mobile-controls.active { display: block; }
  .mob-btn { position: absolute; pointer-events: auto; background: rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 700; user-select: none; -webkit-user-select: none; backdrop-filter: blur(6px); touch-action: none; transition: background 0.1s, transform 0.1s; }
  .mob-btn.pressed { background: rgba(255,107,0,0.6); border-color: #ff6b00; transform: scale(0.92); }
  #btnShoot { right: 30px; bottom: 100px; width: 100px; height: 100px; font-size: 0.9rem; font-weight: 800; background: rgba(255,50,50,0.4); border-color: rgba(255,100,100,0.7); }
  #btnShoot.pressed { background: rgba(255,80,80,0.8); }
  #btnReload { right: 40px; bottom: 215px; width: 60px; height: 60px; font-size: 1.3rem; background: rgba(255,180,0,0.4); border-color: rgba(255,200,50,0.6); }
  #btnJump { right: 140px; bottom: 110px; width: 60px; height: 60px; font-size: 1.2rem; background: rgba(0,150,255,0.4); border-color: rgba(50,180,255,0.6); }
  #btnJump.pressed { background: rgba(50,180,255,0.8); }
  #btnCrouch { right: 140px; bottom: 185px; width: 56px; height: 56px; font-size: 1.1rem; background: rgba(100,100,255,0.4); border-color: rgba(150,150,255,0.6); }
  #btnCrouch.pressed { background: rgba(150,150,255,0.8); }
  #btnAds { left: 50%; transform: translateX(-50%); bottom: 30px; width: 70px; height: 70px; font-size: 1rem; font-weight: 700; background: rgba(0,220,100,0.4); border-color: rgba(0,255,150,0.6); }
  #btnAds.pressed { background: rgba(0,255,150,0.8); }
  #joystick-zone { position: absolute; left: 0; bottom: 0; width: 45%; height: 50%; pointer-events: auto; touch-action: none; }
  #joystick-base { position: absolute; width: 140px; height: 140px; border-radius: 50%; background: rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.3); display: none; pointer-events: none; }
  #joystick-knob { position: absolute; width: 60px; height: 60px; border-radius: 50%; background: rgba(255,107,0,0.6); border: 2px solid rgba(255,255,255,0.5); display: none; pointer-events: none; top: 50%; left: 50%; transform: translate(-50%,-50%); }
  #look-zone { position: absolute; right: 0; top: 0; width: 55%; height: 100%; pointer-events: auto; touch-action: none; }
  #audio-btn { position: fixed; top: 20px; right: 20px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; color: #fff; font-size: 1.4rem; width: 48px; height: 48px; display: none; align-items: center; justify-content: center; cursor: pointer; z-index: 25; backdrop-filter: blur(8px); user-select: none; }
  #audio-btn.muted { opacity: 0.5; }
  #menu-btn { position: fixed; top: 20px; left: 20px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; color: #fff; font-size: 1.4rem; width: 48px; height: 48px; display: none; align-items: center; justify-content: center; cursor: pointer; z-index: 25; backdrop-filter: blur(8px); user-select: none; }
  @media (max-width: 600px) {
    #menu h1 { font-size: 2rem; }
    #menu p { font-size: 0.8rem; margin-bottom: 1rem; }
    #healthbar { width: 160px; height: 22px; bottom: 20px; left: 20px; }
    #healthbar .text { font-size: 0.75rem; }
    #ammo { bottom: 20px; right: 160px; font-size: 1.5rem; }
    #scoreboard { font-size: 0.75rem; padding: 8px 12px; min-width: 140px; }
    #audio-btn, #menu-btn { width: 40px; height: 40px; font-size: 1.1rem; }
    #btnAds { bottom: 15px; }
    #room-id { top: 12px; left: 12px; font-size: 0.72rem; padding: 6px 10px; }
    #killfeed { top: 60px; left: 12px; }
  }
</style>
</head>
<body>

<div id="menu">
  <h1>💥 3D ARENA</h1>
  <p>Каждый сам за себя • Одно оружие • Deathmatch</p>
  <div class="box">
    <input type="text" id="nameInput" placeholder="Ваше имя" maxlength="16" value="Боец">
    <div class="mode-toggle" id="mobileToggle">
      <div class="label"><span>📱</span><span>Мобильное управление</span></div>
      <div class="switch"></div>
    </div>
    <button id="offlineBtn" class="offline-btn">🎮 Играть офлайн (тренировка)</button>
    <div class="divider">мультиплеер</div>
    <button id="createBtn">Создать игру</button>
    <div class="divider">или</div>
    <input type="text" id="codeInput" placeholder="Код комнаты" maxlength="12">
    <button id="joinBtn" class="alt-btn">Присоединиться</button>
    <div class="status" id="status"></div>
    <div class="code" id="myCode" style="display:none"></div>
  </div>
</div>

<div id="hud">
  <div id="room-id"><span class="label">Комната:</span><span class="code">0</span></div>
  <div id="crosshair"></div>
  <div id="hitmarker">✕</div>
  <div id="state-indicator"></div>
  <div id="healthbar">
    <div class="fill" id="healthFill" style="width:100%"></div>
    <div class="text" id="healthText">100 HP</div>
  </div>
  <div id="ammo">
    <div id="ammoCurrent">30</div>
    <div class="reserve" id="ammoReserve">/ 90</div>
    <div class="reloading" id="reloadText" style="display:none">ПЕРЕЗАРЯДКА</div>
    <div class="reloadbar" id="reloadBar"><div class="fill" id="reloadFill" style="width:0%"></div></div>
  </div>
  <div id="scoreboard">
    <div class="title">СЧЁТ</div>
    <div id="scoreRows"></div>
  </div>
  <div id="killfeed"></div>
  <div id="respawn-overlay">
    <div>ВЫ УБИТЫ</div>
    <div class="timer" id="respawnTimer">3</div>
  </div>
</div>

<div id="controls-hint">
  <b>WASD</b> — движение &nbsp;•&nbsp; <b>Shift</b> — бег &nbsp;•&nbsp; <b>Ctrl</b> — присесть<br>
  <b>ПКМ</b> — прицел &nbsp;•&nbsp; <b>ЛКМ</b> — стрельба &nbsp;•&nbsp; <b>R</b> — перезарядка<br>
  <b>Space</b> — прыжок
</div>

<button id="audio-btn" title="Звук">🔊</button>
<button id="menu-btn" title="Меню">☰</button>

<div id="mobile-controls">
  <div id="joystick-zone"><div id="joystick-base"></div><div id="joystick-knob"></div></div>
  <div id="look-zone"></div>
  <div class="mob-btn" id="btnShoot">ОГОНЬ</div>
  <div class="mob-btn" id="btnReload">↻</div>
  <div class="mob-btn" id="btnJump">↑</div>
  <div class="mob-btn" id="btnCrouch">▼</div>
  <div class="mob-btn" id="btnAds">◎</div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
let scene, camera, renderer, clock;
let running = false, offlineMode = false;
let myId = null, isHost = false, peer = null;
let connections = {}, remotePlayers = {};
let myName = "Боец", myColor = 0x00e676;
let sun, sunTarget, mobileMode = false;

const player = {
  x: 0, y: 1.7, z: 0, vx: 0, vz: 0, vy: 0,
  yaw: 0, pitch: 0, onGround: true,
  crouching: false, sprinting: false, ads: false,
  health: 100, kills: 0, deaths: 0, alive: true, respawnTime: 0,
  radius: 0.4, eyeHeight: 1.7, crouchHeight: 1.0, currentEyeHeight: 1.7,
  ammo: 30, reserve: 90, maxAmmo: 30,
  reloading: false, reloadTime: 0, reloadDuration: 1.8,
  fireCooldown: 0, fireRate: 0.1, damage: 25,
  spread: 0.02, adsSpread: 0.003, recoil: 0, muzzleFlashTime: 0
};

const MAP_SIZE = 200;
const keys = {};
const mouse = { left: false, right: false };
let pointerLockEnabled = false;
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['KeyW','KeyA','KeyS','KeyD','Space','KeyR','ShiftLeft','ShiftRight','ControlLeft','ControlRight','KeyC'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyR' && running) startReload();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

document.addEventListener('mousemove', e => {
  if (running && document.pointerLockElement) {
    const sens = player.ads ? 0.0012 : 0.0025;
    player.yaw -= e.movementX * sens;
    player.pitch -= e.movementY * sens;
    player.pitch = Math.max(-Math.PI/2 + 0.05, Math.min(Math.PI/2 - 0.05, player.pitch));
  }
});

document.addEventListener('mousedown', e => {
  if (!running) return;
  if (e.button === 0) {
    mouse.left = true;
    if (!mobileMode && !document.pointerLockElement) {
      document.body.requestPointerLock && document.body.requestPointerLock();
    }
  }
  if (e.button === 2) mouse.right = true;
});
document.addEventListener('mouseup', e => {
  if (e.button === 0) mouse.left = false;
  if (e.button === 2) mouse.right = false;
});
document.addEventListener('pointerlockchange', () => { pointerLockEnabled = !!document.pointerLockElement; });
document.addEventListener('click', () => {
  if (running && !mobileMode && !document.pointerLockElement) {
    document.body.requestPointerLock && document.body.requestPointerLock();
  }
});

const menu = document.getElementById('menu');
const statusEl = document.getElementById('status');
const myCodeEl = document.getElementById('myCode');
const hud = document.getElementById('hud');
const roomIdEl = document.getElementById('room-id');
const healthFill = document.getElementById('healthFill');
const healthText = document.getElementById('healthText');
const ammoCurrent = document.getElementById('ammoCurrent');
const ammoReserve = document.getElementById('ammoReserve');
const reloadText = document.getElementById('reloadText');
const reloadBar = document.getElementById('reloadBar');
const reloadFill = document.getElementById('reloadFill');
const scoreRows = document.getElementById('scoreRows');
const killfeed = document.getElementById('killfeed');
const respawnOverlay = document.getElementById('respawn-overlay');
const respawnTimer = document.getElementById('respawnTimer');
const controlsHint = document.getElementById('controls-hint');
const mobileControls = document.getElementById('mobile-controls');
const mobileToggle = document.getElementById('mobileToggle');
const audioBtn = document.getElementById('audio-btn');
const menuBtn = document.getElementById('menu-btn');
const crosshair = document.getElementById('crosshair');
const hitmarker = document.getElementById('hitmarker');
const stateIndicator = document.getElementById('state-indicator');

const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
if (isTouchDevice) { mobileMode = true; mobileToggle.classList.add('active'); }
mobileToggle.addEventListener('click', () => {
  mobileMode = !mobileMode;
  mobileToggle.classList.toggle('active', mobileMode);
});

const AudioFX = {
  ctx: null, muted: false, master: null,
  init() {
    if (this.ctx) return;
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new Ctx();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.3;
      this.master.connect(this.ctx.destination);
    } catch(e) {}
  },
  shoot() {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const bufSize = Math.floor(0.15 * this.ctx.sampleRate);
    const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufSize, 3);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(3000, t);
    filter.frequency.exponentialRampToValueAtTime(200, t + 0.1);
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.8, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
    src.connect(filter); filter.connect(gain); gain.connect(this.master);
    src.start(t);
    const osc = this.ctx.createOscillator(); osc.type = 'sine';
    osc.frequency.setValueAtTime(120, t);
    osc.frequency.exponentialRampToValueAtTime(40, t + 0.1);
    const g2 = this.ctx.createGain();
    g2.gain.setValueAtTime(0.5, t);
    g2.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
    osc.connect(g2); g2.connect(this.master);
    osc.start(t); osc.stop(t + 0.15);
  },
  hit() {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator(); osc.type = 'square'; osc.frequency.value = 800;
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.15, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
    osc.connect(gain); gain.connect(this.master);
    osc.start(t); osc.stop(t + 0.1);
  },
  reload() {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    [0, 0.3, 0.9, 1.4].forEach((delay, i) => {
      const osc = this.ctx.createOscillator(); osc.type = 'square';
      osc.frequency.value = 400 + i * 150;
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.12, t + delay);
      gain.gain.exponentialRampToValueAtTime(0.01, t + delay + 0.08);
      osc.connect(gain); gain.connect(this.master);
      osc.start(t + delay); osc.stop(t + delay + 0.1);
    });
  },
  empty() {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator(); osc.type = 'square'; osc.frequency.value = 200;
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.1, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);
    osc.connect(gain); gain.connect(this.master);
    osc.start(t); osc.stop(t + 0.06);
  },
  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.value = m ? 0 : 0.3;
    audioBtn.textContent = m ? '🔇' : '🔊';
    audioBtn.classList.toggle('muted', m);
  }
};

const obstacles = [];
function buildMap() {
  const groundGeo = new THREE.PlaneGeometry(MAP_SIZE * 2, MAP_SIZE * 2);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x5a5a4a, roughness: 1 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = !mobileMode;
  scene.add(ground);
  const gridMat = new THREE.MeshBasicMaterial({ color: 0x3a3a2e });
  for (let i = -MAP_SIZE; i <= MAP_SIZE; i += 20) {
    const lineX = new THREE.Mesh(new THREE.PlaneGeometry(MAP_SIZE*2, 0.1), gridMat);
    lineX.rotation.x = -Math.PI / 2; lineX.position.set(0, 0.02, i); scene.add(lineX);
    const lineZ = new THREE.Mesh(new THREE.PlaneGeometry(0.1, MAP_SIZE*2), gridMat);
    lineZ.rotation.x = -Math.PI / 2; lineZ.position.set(i, 0.02, 0); scene.add(lineZ);
  }
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x8a5a3a, roughness: 0.9 });
  const wallHeight = 6;
  const walls = [
    { x: 0, z: -MAP_SIZE, w: MAP_SIZE*2, d: 2 },
    { x: 0, z: MAP_SIZE, w: MAP_SIZE*2, d: 2 },
    { x: -MAP_SIZE, z: 0, w: 2, d: MAP_SIZE*2 },
    { x: MAP_SIZE, z: 0, w: 2, d: MAP_SIZE*2 }
  ];
  walls.forEach(w => {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w.w, wallHeight, w.d), wallMat);
    mesh.position.set(w.x, wallHeight/2, w.z);
    mesh.castShadow = !mobileMode; mesh.receiveShadow = !mobileMode;
    scene.add(mesh);
    obstacles.push({ minX: w.x - w.w/2, maxX: w.x + w.w/2, minZ: w.z - w.d/2, maxZ: w.z + w.d/2 });
  });
  const rng = (seed => () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; })(1337);
  const boxColors = [0x8a5a3a, 0x6a6a5a, 0x4a5a3a, 0x5a5a6a];
  for (let i = 0; i < 80; i++) {
    const x = (rng() - 0.5) * (MAP_SIZE * 1.7);
    const z = (rng() - 0.5) * (MAP_SIZE * 1.7);
    if (Math.hypot(x, z) < 8) continue;
    const type = rng();
    if (type < 0.5) {
      const size = 1.5 + rng() * 1.5;
      const mat = new THREE.MeshStandardMaterial({ color: boxColors[Math.floor(rng()*boxColors.length)], roughness: 0.85 });
      const box = new THREE.Mesh(new THREE.BoxGeometry(size, size, size), mat);
      box.position.set(x, size/2, z);
      box.rotation.y = rng() * Math.PI * 2;
      box.castShadow = !mobileMode; box.receiveShadow = !mobileMode;
      scene.add(box);
      const half = size * 0.75;
      obstacles.push({ minX: x-half, maxX: x+half, minZ: z-half, maxZ: z+half });
    } else if (type < 0.85) {
      const h = 4 + rng() * 6;
      const rad = 0.6 + rng() * 0.8;
      const mat = new THREE.MeshStandardMaterial({ color: 0x777777, roughness: 0.8 });
      const col = new THREE.Mesh(new THREE.CylinderGeometry(rad, rad*1.1, h, 8), mat);
      col.position.set(x, h/2, z);
      col.castShadow = !mobileMode; col.receiveShadow = !mobileMode;
      scene.add(col);
      obstacles.push({ minX: x-rad, maxX: x+rad, minZ: z-rad, maxZ: z+rad });
    } else {
      const len = 4 + rng() * 6;
      const h = 3 + rng() * 3;
      const thick = 0.6;
      const isX = rng() < 0.5;
      const mat = new THREE.MeshStandardMaterial({ color: 0x8a6a5a, roughness: 0.9 });
      const wall = new THREE.Mesh(new THREE.BoxGeometry(isX ? len : thick, h, isX ? thick : len), mat);
      wall.position.set(x, h/2, z);
      wall.rotation.y = rng() * Math.PI;
      wall.castShadow = !mobileMode; wall.receiveShadow = !mobileMode;
      scene.add(wall);
      const hw = (isX ? len : thick) / 2, hd = (isX ? thick : len) / 2;
      obstacles.push({ minX: x-hw, maxX: x+hw, minZ: z-hd, maxZ: z+hd });
    }
  }
  const treeMat = new THREE.MeshStandardMaterial({ color: 0x1a4d1a, roughness: 1 });
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a2a10, roughness: 1 });
  for (let i = 0; i < 40; i++) {
    const ang = (i / 40) * Math.PI * 2;
    const r = MAP_SIZE * 1.05;
    const x = Math.cos(ang) * r, z = Math.sin(ang) * r;
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 4, 5), trunkMat);
    trunk.position.set(x, 2, z); trunk.castShadow = !mobileMode; scene.add(trunk);
    const foliage = new THREE.Mesh(new THREE.ConeGeometry(3, 8, 6), treeMat);
    foliage.position.set(x, 8, z); foliage.castShadow = !mobileMode; scene.add(foliage);
  }
}

const tracers = [];
function spawnTracer(from, to) {
  const geo = new THREE.BufferGeometry().setFromPoints([from, to]);
  const mat = new THREE.LineBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0.9 });
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  tracers.push({ line, life: 0.08 });
}
function updateTracers(dt) {
  for (let i = tracers.length - 1; i >= 0; i--) {
    tracers[i].life -= dt;
    tracers[i].line.material.opacity = tracers[i].life / 0.08;
    if (tracers[i].life <= 0) {
      scene.remove(tracers[i].line);
      tracers[i].line.geometry.dispose();
      tracers[i].line.material.dispose();
      tracers.splice(i, 1);
    }
  }
}

function shoot() {
  if (!player.alive || player.reloading || player.fireCooldown > 0) return;
  if (player.ammo <= 0) {
    AudioFX.empty();
    player.fireCooldown = 0.3;
    if (player.reserve > 0) startReload();
    return;
  }
  player.ammo--;
  player.fireCooldown = player.fireRate;
  player.recoil = Math.min(1, player.recoil + 0.15);
  updateAmmoUI();
  AudioFX.shoot();
  weaponRecoil = 0.08;
  if (muzzleFlash) { muzzleFlash.visible = true; player.muzzleFlashTime = 0.05; }

  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  const spread = player.ads ? player.adsSpread : player.spread;
  dir.x += (Math.random() - 0.5) * spread;
  dir.y += (Math.random() - 0.5) * spread;
  dir.z += (Math.random() - 0.5) * spread;
  dir.normalize();

  const origin = camera.position.clone();
  const raycaster = new THREE.Raycaster(origin, dir, 0.1, 200);
  const targets = [];
  for (const id in remotePlayers) {
    const rp = remotePlayers[id];
    if (rp.alive && rp.mesh) targets.push({ obj: rp.mesh, type: 'player', ref: rp, id });
  }
  const targetMeshes = targets.map(t => t.obj);
  const allIntersects = raycaster.intersectObjects([...targetMeshes, ...scene.children.filter(c => c.isMesh && !targetMeshes.includes(c))]);
  let hitPoint = origin.clone().add(dir.clone().multiplyScalar(200));
  for (const hit of allIntersects) {
    const target = targets.find(t => { let obj = hit.object; while (obj) { if (obj === t.obj) return true; obj = obj.parent; } return false; });
    hitPoint = hit.point;
    if (target) {
      if (target.type === 'player') {
        const conn = connections[target.id];
        if (conn && conn.open) conn.send({ type: 'hit', targetId: target.id, damage: player.damage, killerName: myName });
        showHitmarker();
        AudioFX.hit();
      }
      break;
    } else break;
  }
  spawnTracer(origin.clone().add(dir.clone().multiplyScalar(1.5)), hitPoint);
  if (!offlineMode) {
    const shotData = { type: 'shot', id: myId, tx: hitPoint.x, ty: hitPoint.y, tz: hitPoint.z };
    for (const pid in connections) { const c = connections[pid]; if (c.open) c.send(shotData); }
  }
}

function checkCollisions(entity, radius) {
  for (const o of obstacles) {
    const closestX = Math.max(o.minX, Math.min(entity.x, o.maxX));
    const closestZ = Math.max(o.minZ, Math.min(entity.z, o.maxZ));
    const dx = entity.x - closestX, dz = entity.z - closestZ;
    const dist = Math.hypot(dx, dz);
    if (dist < radius) {
      if (dist > 0.001) {
        const push = radius - dist;
        entity.x += (dx / dist) * push;
        entity.z += (dz / dist) * push;
      } else {
        const toLeft = entity.x - o.minX, toRight = o.maxX - entity.x;
        const toTop = entity.z - o.minZ, toBottom = o.maxZ - entity.z;
        const min = Math.min(toLeft, toRight, toTop, toBottom);
        if (min === toLeft) entity.x = o.minX - radius;
        else if (min === toRight) entity.x = o.maxX + radius;
        else if (min === toTop) entity.z = o.minZ - radius;
        else entity.z = o.maxZ + radius;
      }
    }
  }
}

const BASE_SPEED = 5.0, SPRINT_MULT = 1.7, CROUCH_MULT = 0.45, ADS_MULT = 0.6, JUMP_VELOCITY = 6.5, GRAVITY = -20;

function updatePlayerPhysics(dt) {
  if (!player.alive) return;
  const wantCrouch = keys['ControlLeft'] || keys['ControlRight'] || keys['KeyC'];
  const sprintKey = keys['ShiftLeft'] || keys['ShiftRight'];
  const movingForward = keys['KeyW'];
  player.crouching = wantCrouch;
  player.ads = mouse.right && !player.crouching && !player.reloading;
  player.sprinting = sprintKey && movingForward && !player.crouching && !player.ads && player.onGround;

  const targetEye = player.crouching ? player.crouchHeight : player.eyeHeight;
  player.currentEyeHeight += (targetEye - player.currentEyeHeight) * Math.min(1, dt * 10);

  let speed = BASE_SPEED;
  if (player.crouching) speed *= CROUCH_MULT;
  else if (player.ads) speed *= ADS_MULT;
  else if (player.sprinting) speed *= SPRINT_MULT;

  let moveX = 0, moveZ = 0;
  if (keys['KeyW']) { moveX += Math.sin(player.yaw); moveZ += Math.cos(player.yaw); }
  if (keys['KeyS']) { moveX -= Math.sin(player.yaw); moveZ -= Math.cos(player.yaw); }
  if (keys['KeyA']) { moveX -= Math.cos(player.yaw); moveZ += Math.sin(player.yaw); }
  if (keys['KeyD']) { moveX += Math.cos(player.yaw); moveZ -= Math.sin(player.yaw); }
  const len = Math.hypot(moveX, moveZ);
  if (len > 0) { moveX /= len; moveZ /= len; }

  const targetVx = moveX * speed, targetVz = moveZ * speed;
  const accel = player.onGround ? (player.crouching ? 15 : 25) : 5;
  player.vx += (targetVx - player.vx) * Math.min(1, accel * dt);
  player.vz += (targetVz - player.vz) * Math.min(1, accel * dt);
  player.x += player.vx * dt;
  player.z += player.vz * dt;

  if (keys['Space'] && player.onGround && !player.crouching) {
    player.vy = JUMP_VELOCITY;
    player.onGround = false;
  }
  player.vy += GRAVITY * dt;
  player.y += player.vy * dt;
  const groundY = player.currentEyeHeight;
  if (player.y <= groundY) { player.y = groundY; player.vy = 0; player.onGround = true; }

  player.x = Math.max(-MAP_SIZE + 1.5, Math.min(MAP_SIZE - 1.5, player.x));
  player.z = Math.max(-MAP_SIZE + 1.5, Math.min(MAP_SIZE - 1.5, player.z));
  checkCollisions(player, player.radius);
  updateStateIndicator();
}

function updateStateIndicator() {
  if (player.crouching) { stateIndicator.textContent = '▼ ПРИСЕД'; stateIndicator.className = 'show crouch'; }
  else if (player.ads) { stateIndicator.textContent = '◎ ПРИЦЕЛ'; stateIndicator.className = 'show ads'; }
  else if (player.sprinting) { stateIndicator.textContent = '⚡ БЕГ'; stateIndicator.className = 'show sprint'; }
  else stateIndicator.className = '';
}
let joystick = { active: false, dx: 0, dz: 0, baseX: 0, baseY: 0 };
const joystickBase = document.getElementById('joystick-base');
const joystickKnob = document.getElementById('joystick-knob');
const joystickZone = document.getElementById('joystick-zone');
const lookZone = document.getElementById('look-zone');

if (isTouchDevice) {
  joystickZone.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    joystick.active = true; joystick.baseX = t.clientX; joystick.baseY = t.clientY;
    joystickBase.style.display = 'block'; joystickKnob.style.display = 'block';
    joystickBase.style.left = (t.clientX - 70) + 'px'; joystickBase.style.top = (t.clientY - 70) + 'px';
    joystickBase.style.bottom = 'auto';
    joystickKnob.style.left = t.clientX + 'px'; joystickKnob.style.top = t.clientY + 'px';
  }, { passive: false });

  joystickZone.addEventListener('touchmove', (e) => {
    if (!joystick.active) return;
    e.preventDefault();
    const t = e.touches[0];
    let dx = t.clientX - joystick.baseX, dy = t.clientY - joystick.baseY;
    const maxDist = 70, dist = Math.hypot(dx, dy);
    if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
    joystick.dx = dx / maxDist; joystick.dz = dy / maxDist;
    joystickKnob.style.left = (joystick.baseX + dx) + 'px'; joystickKnob.style.top = (joystick.baseY + dy) + 'px';
    keys['KeyW'] = joystick.dz < -0.3; keys['KeyS'] = joystick.dz > 0.3;
    keys['KeyA'] = joystick.dx < -0.3; keys['KeyD'] = joystick.dx > 0.3;
    keys['ShiftLeft'] = joystick.dz < -0.7;
  }, { passive: false });

  const endJoystick = (e) => {
    if (e) e.preventDefault();
    joystick.active = false; joystick.dx = 0; joystick.dz = 0;
    joystickBase.style.display = 'none'; joystickKnob.style.display = 'none';
    keys['KeyW'] = keys['KeyA'] = keys['KeyS'] = keys['KeyD'] = keys['ShiftLeft'] = false;
  };
  joystickZone.addEventListener('touchend', endJoystick);
  joystickZone.addEventListener('touchcancel', endJoystick);

  let lookTouchId = null, lastLX = 0, lastLY = 0;
  lookZone.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.changedTouches[0];
    lookTouchId = t.identifier; lastLX = t.clientX; lastLY = t.clientY;
  }, { passive: false });
  lookZone.addEventListener('touchmove', (e) => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === lookTouchId) {
        const dx = t.clientX - lastLX, dy = t.clientY - lastLY;
        lastLX = t.clientX; lastLY = t.clientY;
        const sens = player.ads ? 0.003 : 0.005;
        player.yaw -= dx * sens; player.pitch -= dy * sens;
        player.pitch = Math.max(-Math.PI/2 + 0.05, Math.min(Math.PI/2 - 0.05, player.pitch));
      }
    }
  }, { passive: false });
  lookZone.addEventListener('touchend', (e) => {
    for (const t of e.changedTouches) if (t.identifier === lookTouchId) lookTouchId = null;
  });

  document.getElementById('btnShoot').addEventListener('touchstart', (e) => {
    e.preventDefault(); mouse.left = true;
    document.getElementById('btnShoot').classList.add('pressed');
  }, { passive: false });
  document.getElementById('btnShoot').addEventListener('touchend', (e) => {
    e.preventDefault(); mouse.left = false;
    document.getElementById('btnShoot').classList.remove('pressed');
  }, { passive: false });

  document.getElementById('btnReload').addEventListener('touchstart', (e) => {
    e.preventDefault(); startReload();
    document.getElementById('btnReload').classList.add('pressed');
    setTimeout(() => document.getElementById('btnReload').classList.remove('pressed'), 200);
  }, { passive: false });

  document.getElementById('btnJump').addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (player.onGround && !player.crouching) { player.vy = JUMP_VELOCITY; player.onGround = false; }
    document.getElementById('btnJump').classList.add('pressed');
  }, { passive: false });
  document.getElementById('btnJump').addEventListener('touchend', (e) => {
    e.preventDefault(); document.getElementById('btnJump').classList.remove('pressed');
  }, { passive: false });

  document.getElementById('btnCrouch').addEventListener('touchstart', (e) => {
    e.preventDefault();
    keys['ControlLeft'] = !keys['ControlLeft'];
    document.getElementById('btnCrouch').classList.toggle('pressed', keys['ControlLeft']);
  }, { passive: false });

  document.getElementById('btnAds').addEventListener('touchstart', (e) => {
    e.preventDefault();
    mouse.right = !mouse.right;
    document.getElementById('btnAds').classList.toggle('pressed', mouse.right);
  }, { passive: false });
}

function startGame(offline) {
  if (running) return;
  running = true;
  offlineMode = offline;
  menu.style.display = 'none';
  hud.style.display = 'block';
  audioBtn.style.display = 'flex';
  menuBtn.style.display = 'flex';
  if (mobileMode) { mobileControls.classList.add('active'); controlsHint.style.display = 'none'; }
  else controlsHint.style.display = 'block';
  if (!scene) initThree();
  buildMap();
  player.x = 0; player.z = 0;
  player.currentEyeHeight = player.eyeHeight;
  player.y = player.eyeHeight;
  player.yaw = 0; player.pitch = 0;
  player.health = 100; player.alive = true;
  player.ammo = 30; player.reserve = 90;
  player.kills = 0; player.deaths = 0;
  updateHealthUI(); updateAmmoUI();
  weaponGroup = createWeaponViewmodel();
  camera.add(weaponGroup);
  scene.add(camera);
  if (!mobileMode) {
    setTimeout(() => { document.body.requestPointerLock && document.body.requestPointerLock(); }, 500);
  }
  const initAudio = () => {
    AudioFX.init();
    window.removeEventListener('pointerdown', initAudio);
    window.removeEventListener('keydown', initAudio);
  };
  window.addEventListener('pointerdown', initAudio);
  window.addEventListener('keydown', initAudio);
  updateScoreboard();
  clock = new THREE.Clock();
  animate();
  if (!offline) setInterval(() => { if (running) broadcastState(); }, 50);
}

function broadcastState() {
  if (offlineMode || !peer || peer.destroyed) return;
  const data = {
    type: 'state', id: myId, name: myName, color: myColor,
    pos: { x: player.x, y: player.y, z: player.z },
    yaw: player.yaw, health: player.health, alive: player.alive, kills: player.kills
  };
  for (const pid in connections) {
    const c = connections[pid];
    if (c.open) { try { c.send(data); } catch(e) {} }
  }
}

function updateCamera(dt) {
  camera.position.set(player.x, player.y, player.z);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;
  camera.rotation.z = 0;
  const targetFov = player.ads ? 55 : 75;
  camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 12);
  camera.updateProjectionMatrix();
  if (player.ads) crosshair.classList.add('ads'); else crosshair.classList.remove('ads');
  if (weaponGroup) {
    player.recoil *= Math.pow(0.001, dt);
    weaponRecoil *= Math.pow(0.0001, dt);
    const targetPos = player.ads ? weaponAdsPos : weaponBasePos;
    weaponGroup.position.x += (targetPos.x - weaponGroup.position.x) * Math.min(1, dt * 20);
    weaponGroup.position.y += (targetPos.y - weaponGroup.position.y) * Math.min(1, dt * 20);
    weaponGroup.position.z += (targetPos.z - weaponGroup.position.z) * Math.min(1, dt * 20);
    weaponGroup.rotation.x = weaponRecoil;
    const speed = Math.hypot(player.vx, player.vz);
    const bobAmt = player.onGround ? Math.min(1, speed / 8) * (player.ads ? 0.003 : 0.012) : 0;
    const bobT = performance.now() * 0.008;
    weaponGroup.position.x += Math.sin(bobT) * bobAmt;
    weaponGroup.position.y += Math.abs(Math.cos(bobT)) * bobAmt;
    if (!player.ads) camera.rotation.x += player.recoil * 0.05;
    if (muzzleFlash) {
      if (player.muzzleFlashTime > 0) {
        player.muzzleFlashTime -= dt;
        muzzleFlash.visible = true;
        muzzleFlash.scale.setScalar(0.7 + Math.random() * 0.6);
      } else muzzleFlash.visible = false;
    }
  }
}

function animate() {
  if (!running) return;
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (player.alive) updatePlayerPhysics(dt);
  if (mouse.left && player.alive) shoot();
  if (player.fireCooldown > 0) player.fireCooldown -= dt;
  updateReload(dt);
  if (!player.alive) {
    player.respawnTime -= dt;
    respawnTimer.textContent = Math.ceil(Math.max(0, player.respawnTime));
    if (player.respawnTime <= 0) respawnPlayer();
  }
  for (const id in remotePlayers) {
    const rp = remotePlayers[id];
    const p = rp.mesh.position;
    const tp = rp.targetPos || { x: 0, y: 1.7, z: 0 };
    p.x += (tp.x - p.x) * Math.min(1, dt * 10);
    p.z += (tp.z - p.z) * Math.min(1, dt * 10);
    p.y = 0;
    let targetYaw = rp.targetYaw || 0;
    let curYaw = rp.mesh.rotation.y;
    let diff = targetYaw - curYaw;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    rp.mesh.rotation.y = curYaw + diff * Math.min(1, dt * 10);
    rp.mesh.visible = rp.alive;
  }
  updateTracers(dt);
  updateCamera(dt);
  sun.position.set(player.x + 60, 120, player.z + 40);
  sunTarget.position.set(player.x, 0, player.z);
  sun.target.updateMatrixWorld();
  renderer.render(scene, camera);
}

function generateCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function startOffline() {
  myName = document.getElementById('nameInput').value.trim() || 'Боец';
  myColor = new THREE.Color().setHSL(Math.random(), 0.8, 0.6).getHex();
  offlineMode = true; isHost = false;
  updateRoomIdUI(null);
  startGame(true);
}
function createGame() {
  myName = document.getElementById('nameInput').value.trim() || 'Боец';
  myColor = new THREE.Color().setHSL(Math.random(), 0.8, 0.6).getHex();
  isHost = true; offlineMode = false;
  const roomCode = 'arena-' + generateCode();
  statusEl.textContent = 'Создание комнаты...';
  document.getElementById('createBtn').disabled = true;
  document.getElementById('joinBtn').disabled = true;
  document.getElementById('offlineBtn').disabled = true;
  peer = new Peer(roomCode, { debug: 1 });
  peer.on('open', id => {
    myId = id;
    myCodeEl.textContent = 'Код: ' + id;
    myCodeEl.style.display = 'block';
    statusEl.textContent = 'Комната создана!';
    updateRoomIdUI(id);
    startGame(false);
  });
  peer.on('connection', conn => setupConnection(conn));
  peer.on('error', err => {
    statusEl.textContent = 'Ошибка: ' + err.type;
    document.getElementById('createBtn').disabled = false;
    document.getElementById('joinBtn').disabled = false;
    document.getElementById('offlineBtn').disabled = false;
  });
}
function joinGame() {
  myName = document.getElementById('nameInput').value.trim() || 'Боец';
  myColor = new THREE.Color().setHSL(Math.random(), 0.8, 0.6).getHex();
  offlineMode = false;
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  if (!code) { statusEl.textContent = 'Введите код'; return; }
  const roomCode = code.startsWith('arena-') ? code : 'arena-' + code;
  statusEl.textContent = 'Подключение...';
  document.getElementById('createBtn').disabled = true;
  document.getElementById('joinBtn').disabled = true;
  document.getElementById('offlineBtn').disabled = true;
  peer = new Peer({ debug: 1 });
  peer.on('open', id => {
    myId = id;
    const conn = peer.connect(roomCode, { reliable: false, serialization: 'json' });
    conn.on('open', () => {
      setupConnection(conn);
      statusEl.textContent = 'Подключено!';
      updateRoomIdUI(roomCode);
      startGame(false);
    });
    conn.on('error', () => {
      statusEl.textContent = 'Не удалось подключиться';
      document.getElementById('createBtn').disabled = false;
      document.getElementById('joinBtn').disabled = false;
      document.getElementById('offlineBtn').disabled = false;
    });
  });
  peer.on('connection', conn => setupConnection(conn));
  peer.on('error', err => {
    statusEl.textContent = 'Ошибка: ' + err.type;
    document.getElementById('createBtn').disabled = false;
    document.getElementById('joinBtn').disabled = false;
    document.getElementById('offlineBtn').disabled = false;
  });
}
function setupConnection(conn) {
  connections[conn.peer] = conn;
  conn.on('open', () => {
    conn.send({ type: 'hello', id: myId, name: myName, color: myColor });
    if (isHost) {
      for (const pid in remotePlayers) {
        const rp = remotePlayers[pid];
        conn.send({ type: 'hello', id: pid, name: rp.name, color: rp.color });
      }
    }
    updateScoreboard();
  });
  conn.on('data', data => handleMessage(data, conn));
  conn.on('close', () => {
    delete connections[conn.peer];
    if (remotePlayers[conn.peer]) {
      scene.remove(remotePlayers[conn.peer].mesh);
      delete remotePlayers[conn.peer];
    }
    updateScoreboard();
  });
}
function handleMessage(data, conn) {
  if (!data || !data.type) return;
  if (data.type === 'hello') {
    if (data.id !== myId && !remotePlayers[data.id]) {
      addRemotePlayer(data.id, data.name, data.color);
      if (isHost) {
        for (const pid in connections) {
          if (pid !== conn.peer && pid !== data.id) {
            connections[pid].send({ type: 'hello', id: data.id, name: data.name, color: data.color });
          }
        }
      }
      updateScoreboard();
    }
  } else if (data.type === 'state') {
    if (remotePlayers[data.id]) {
      const rp = remotePlayers[data.id];
      rp.targetPos = data.pos; rp.targetYaw = data.yaw;
      rp.health = data.health; rp.alive = data.alive; rp.kills = data.kills;
      rp.mesh.visible = data.alive;
    } else addRemotePlayer(data.id, data.name || 'Боец', data.color || 0xff006e);
  } else if (data.type === 'shot') {
    if (remotePlayers[data.id]) {
      const rp = remotePlayers[data.id];
      spawnTracer(
        new THREE.Vector3(rp.mesh.position.x, 1.4, rp.mesh.position.z),
        new THREE.Vector3(data.tx, data.ty, data.tz)
      );
    }
  } else if (data.type === 'hit') {
    if (data.targetId === myId) {
      player.health -= data.damage;
      updateHealthUI();
      AudioFX.hit();
      hitmarker.textContent = '✕'; hitmarker.style.color = '#ff0000';
      hitmarker.classList.add('show');
      setTimeout(() => hitmarker.classList.remove('show'), 150);
      if (player.health <= 0) playerDie(data.killerName || 'Враг');
    }
  } else if (data.type === 'kill') {
    addKillfeed(data.killerName, data.victimName);
    if (remotePlayers[data.killerId]) remotePlayers[data.killerId].kills = data.killerKills;
    updateScoreboard();
  } else if (data.type === 'died') {
    if (remotePlayers[data.id]) {
      remotePlayers[data.id].alive = false;
      remotePlayers[data.id].deaths = (remotePlayers[data.id].deaths || 0) + 1;
      remotePlayers[data.id].mesh.visible = false;
    }
    addKillfeed(data.killerName, remotePlayers[data.id]?.name || 'Боец');
    updateScoreboard();
  }
}
function addRemotePlayer(id, name, color) {
  if (remotePlayers[id]) return;
  const mesh = createPlayerMesh(color, name);
  scene.add(mesh);
  remotePlayers[id] = { mesh, targetPos: { x: 0, y: 1.7, z: 0 }, targetYaw: 0, name, color, health: 100, alive: true, kills: 0, deaths: 0 };
  updateScoreboard();
}
function createPlayerMesh(color, name) {
  const group = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color, roughness: 0.6 });
  const skinMat = new THREE.MeshStandardMaterial({ color: 0xffcc99, roughness: 0.9 });
  const gunMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8, roughness: 0.3 });
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.8, 0.4), bodyMat);
  torso.position.y = 1.05; torso.castShadow = !mobileMode; group.add(torso);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 12), skinMat);
  head.position.y = 1.65; head.castShadow = !mobileMode; group.add(head);
  const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.24, 12, 8, 0, Math.PI*2, 0, Math.PI/2), bodyMat);
  helmet.position.y = 1.68; group.add(helmet);
  const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.6, 0.18), bodyMat);
  leftArm.position.set(-0.42, 1.05, 0); leftArm.castShadow = !mobileMode; group.add(leftArm);
  const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.6, 0.18), bodyMat);
  rightArm.position.set(0.42, 1.05, 0); rightArm.castShadow = !mobileMode; group.add(rightArm);
  const legMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
  const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.7, 0.25), legMat);
  leftLeg.position.set(-0.17, 0.35, 0); leftLeg.castShadow = !mobileMode; group.add(leftLeg);
  const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.7, 0.25), legMat);
  rightLeg.position.set(0.17, 0.35, 0); rightLeg.castShadow = !mobileMode; group.add(rightLeg);
  const gun = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 0.55), gunMat);
  gun.position.set(0.42, 1.05, 0.35); group.add(gun);
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.4, 8), gunMat);
  barrel.rotation.x = Math.PI / 2; barrel.position.set(0.42, 1.08, 0.65); group.add(barrel);
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, 256, 64);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 32px Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(name, 128, 32);
  const tex = new THREE.CanvasTexture(canvas);
  const spriteMat = new THREE.SpriteMaterial({ map: tex, depthTest: false });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.scale.set(2.5, 0.6, 1); sprite.position.set(0, 2.2, 0);
  group.add(sprite);
  return group;
}

document.getElementById('createBtn').addEventListener('click', createGame);
document.getElementById('joinBtn').addEventListener('click', joinGame);
document.getElementById('offlineBtn').addEventListener('click', startOffline);
document.getElementById('codeInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') joinGame();
});
menuBtn.addEventListener('click', () => {
  if (running && confirm('Выйти в меню?')) location.reload();
});
window.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('beforeunload', () => {
  if (peer && !peer.destroyed) peer.destroy();
});
</script>
